services:
  api:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: epatti-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATA_DIR: /data
      GENERATED_DIR: /generated
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "4000:4000"
    volumes:
      - epatti_data:/data
      - epatti_generated:/generated

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    container_name: epatti-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  epatti_data:
  epatti_generated:
